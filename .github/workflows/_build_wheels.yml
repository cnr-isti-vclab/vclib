name: Reusable Bindings - Build and test Wheel

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        description: "The commit SHA or ref to checkout. Defaults to the workflow trigger ref."

jobs:
  bindings_build_wheel:
    name: Bindings - Build Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VCLIB_WHEEL_BUILD_DIR: ${{ github.workspace }}/build_wheel
      VCLIB_MACOS_UNIVERSAL: ${{ startsWith(matrix.os, 'macos') && '1' || '0' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.os, 'macos') && '15.0' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04-arm', 'macos-latest', 'windows-latest']
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64

    - name: Install Qt
      uses: ./.github/actions/install-qt

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install gcc-15 g++-15 cmake ninja-build
        sudo apt-get install freeglut3-dev libgl1-mesa-dev libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev libgmp-dev libmpfr-dev libwayland-dev wayland-protocols libxkbcommon-dev

    - name: Setup GCC 15 for Linux
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-15" >> $GITHUB_ENV
        echo "CXX=g++-15" >> $GITHUB_ENV
        echo "LDFLAGS=-static-libstdc++ -static-libgcc" >> $GITHUB_ENV

    - name: Install dependencies
      if: runner.os == 'Windows'
      run: |
        choco install ninja ccache

    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: bindings-${{ matrix.os }}
        max-size: 1G

    - name: Build and Install bgfx
      if: runner.os != 'macOS'
      uses: ./.github/actions/build-install-bgfx

    - name: Build and Install lib3mf
      uses: ./.github/actions/build-install-lib3mf

    - name: Build Wheel 3.12
      uses: ./.github/actions/build-python-wheel
      with:
        python-version: '3.12'
        os: ${{ runner.os }}

    - name: Build Wheel 3.13
      uses: ./.github/actions/build-python-wheel
      with:
        python-version: '3.13'
        os: ${{ runner.os }}

    - name: Build Wheel 3.14
      uses: ./.github/actions/build-python-wheel
      with:
        python-version: '3.14'
        os: ${{ runner.os }}

    - name: Verify Universal macOS Wheels
      if: runner.os == 'macOS'
      run: |
        shopt -s nullglob
        wheels=(dist/*universal2.whl)
        if [ ${#wheels[@]} -eq 0 ]; then
          echo "ERROR: No universal2 wheel found in dist/" >&2
          ls -la dist/
          exit 1
        fi
        tmp_dir=$(mktemp -d)
        for whl in "${wheels[@]}"; do
          echo "=== Checking $whl ==="
          unzip -q -o "$whl" -d "$tmp_dir"
        done
        binaries=()
        while IFS= read -r -d '' so; do
          binaries+=("$so")
        done < <(find "$tmp_dir" -type f -name '*.so' -print0)
        if [ ${#binaries[@]} -eq 0 ]; then
          echo "ERROR: No .so modules found inside universal2 wheel(s)" >&2
          find "$tmp_dir" -maxdepth 5
          exit 1
        fi
        for so in "${binaries[@]}"; do
          archs=$(lipo -archs "$so")
          echo "$so -> architectures: $archs"
          if [[ "$archs" != *"x86_64"* ]] || [[ "$archs" != *"arm64"* ]]; then
            echo "ERROR: $so is missing x86_64 or arm64 slice ($archs)" >&2
            exit 1
          fi
          otool -L "$so"
          if otool -L "$so" | grep -E "(/opt/homebrew|/usr/local)"; then
            echo "ERROR: $so links against a local/Homebrew dynamic library!" >&2
            exit 1
          fi
        done

    - name: Upload Wheels
      uses: actions/upload-artifact@v7
      with:
        name: vclib-wheel-${{ matrix.os }}
        path: dist/*.whl

  run_python_examples:
    name: Run Python Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: bindings_build_wheel
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04-arm', 'macos-26-intel', 'macos-latest', 'windows-latest']
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: ${{ inputs.ref || github.sha }}

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install freeglut3-dev libgl1-mesa-dev

    - uses: actions/download-artifact@v8
      with:
        name: vclib-wheel-${{ matrix.os == 'macos-26-intel' && 'macos-latest' || matrix.os }}
        path: dist/

    - name: Run Examples 3.12
      uses: ./.github/actions/run-python-examples
      with:
        python-version: '3.12'

    - name: Run Examples 3.13
      uses: ./.github/actions/run-python-examples
      with:
        python-version: '3.13'

    - name: Run Examples 3.14
      uses: ./.github/actions/run-python-examples
      with:
        python-version: '3.14'
