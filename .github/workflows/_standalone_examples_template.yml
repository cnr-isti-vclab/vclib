name: Reusable Standalone Examples Template

on:
  workflow_call:
    inputs:
      integration_mode:
        required: true
        type: string
        description: "Integration mode: 'archive', 'installer', or 'FetchContent'"

jobs:
  build_and_run_standalone_examples:
    name: Standalone Examples (${{ matrix.os }}, ${{ matrix.module }}, ${{ matrix.integration_mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-26.04', 'ubuntu-26.04-arm', 'macos-26-intel', 'macos-latest', 'windows-latest']
        module: ['core', 'external', 'render']
        integration_mode: ['${{ inputs.integration_mode }}']
        exclude:
          - os: 'macos-26-intel'
            integration_mode: 'installer'
          - os: 'macos-latest'
            integration_mode: 'installer'
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64

    - name: Install Qt
      if: matrix.module == 'render' && (runner.os != 'Linux' || matrix.integration_mode != 'installer')
      uses: ./.github/actions/install-qt

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libtbb-dev
        if [ "${{ matrix.module }}" == "external" ]; then
          sudo apt-get install -y libembree-dev libgmp-dev libmpfr-dev
        fi
        if [ "${{ matrix.module }}" == "render" ]; then
          sudo apt-get install -y freeglut3-dev libgl1-mesa-dev libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev libgmp-dev libmpfr-dev libwayland-dev wayland-protocols libxkbcommon-dev mesa-vulkan-drivers
        fi

    - name: Install dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cmake ninja tbb
        if [ "${{ matrix.module }}" == "external" ]; then
          brew install embree gmp mpfr
        fi

    - name: Install dependencies
      if: runner.os == 'Windows'
      shell: bash
      run: |
        choco install -y cmake ninja

    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: standalone-${{ matrix.os }}-${{ matrix.integration_mode }}-${{ matrix.module }}
        max-size: 1G

    - name: Download VCLib Archive Package
      if: matrix.integration_mode == 'archive'
      uses: actions/download-artifact@v8
      with:
        name: vclib-package-${{ matrix.module == 'core' && 'core' || 'all' }}-${{ runner.os }}-${{ runner.arch }}
        path: install-vclib

    - name: VCLib Archive Package Permissions
      if: matrix.integration_mode == 'archive' && (runner.os == 'Linux' || runner.os == 'macOS')
      shell: bash
      run: |
        if [ -d "install-vclib/bin" ]; then
          chmod -R +x install-vclib/bin/*
        fi

    - name: Download VCLib Installer Package
      if: matrix.integration_mode == 'installer'
      uses: actions/download-artifact@v8
      with:
        pattern: vclib-installer-*-${{ runner.os }}-${{ runner.arch }}
        path: installer-vclib
        merge-multiple: true

    - name: Install VCLib DEB Package
      if: matrix.integration_mode == 'installer' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ./installer-vclib/*.deb

    - name: Install VCLib NSIS Package
      if: matrix.integration_mode == 'installer' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = (Get-Item installer-vclib/*.exe | Select-Object -First 1).FullName
        Start-Process $installer -ArgumentList "/S" -Wait
        # Locate the installed vclib bin directory and add it to GITHUB_PATH
        $vclibBin = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Directory -Filter "VCLib*" -ErrorAction SilentlyContinue |
                    ForEach-Object { Join-Path $_.FullName "bin" } |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1
        if ($vclibBin) {
          echo "Found VCLib bin at $vclibBin"
          echo $vclibBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        } else {
          Write-Error "Could not find VCLib bin directory!"
          exit 1
        }

    - name: Set CMake Arguments
      shell: bash
      run: |
        ARGS=""
        if [ "${{ matrix.integration_mode }}" == "FetchContent" ]; then
          ARGS="-DVCLIB_STANDALONE_USE_FETCHCONTENT=ON"
        elif [ "${{ matrix.integration_mode }}" == "installer" ]; then
          ARGS="-DVCLIB_STANDALONE_USE_FETCHCONTENT=OFF"
        else
          ARGS="-DVCLIB_STANDALONE_USE_FETCHCONTENT=OFF -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-vclib"
        fi
        echo "BASE_CMAKE_ARGS=$ARGS" >> $GITHUB_ENV

    - name: Configure Standalone Examples
      shell: bash
      run: |
        EXTRA_ARGS=""
        if [ "${{ matrix.module }}" == "core" ]; then
          EXTRA_ARGS="-DVCLIB_STANDALONE_BUILD_CORE=ON -DVCLIB_STANDALONE_BUILD_EXTERNAL=OFF -DVCLIB_STANDALONE_BUILD_RENDER=OFF"
        elif [ "${{ matrix.module }}" == "external" ]; then
          EXTRA_ARGS="-DVCLIB_STANDALONE_BUILD_CORE=OFF -DVCLIB_STANDALONE_BUILD_EXTERNAL=ON -DVCLIB_STANDALONE_BUILD_RENDER=OFF"
        elif [ "${{ matrix.module }}" == "render" ]; then
          EXTRA_ARGS="-DVCLIB_STANDALONE_BUILD_CORE=OFF -DVCLIB_STANDALONE_BUILD_EXTERNAL=OFF -DVCLIB_STANDALONE_BUILD_RENDER=ON -DVCLIB_RENDER_BACKEND=bgfx"
        fi

        cmake -S examples/standalone -B examples/standalone/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          $BASE_CMAKE_ARGS \
          $EXTRA_ARGS

    - name: Build Standalone Examples
      run: cmake --build examples/standalone/build

    - name: Run Tests
      working-directory: examples/standalone/build
      shell: bash
      run: |
        if [ "${{ matrix.module }}" != "render" ]; then
          if [ "$RUNNER_OS" == "Windows" ] && [ "${{ matrix.module }}" == "external" ]; then
            if [ "${{ matrix.integration_mode }}" == "archive" ]; then
              export PATH="${{ github.workspace }}/install-vclib/bin:$PATH"
            elif [ "${{ matrix.integration_mode }}" == "installer" ]; then
              VCLIB_BIN=$(ls -d "/c/Program Files"/[Vv][Cc][Ll]ib*/bin 2>/dev/null | head -n 1)
              if [ -n "$VCLIB_BIN" ]; then
                export PATH="$VCLIB_BIN:$PATH"
              fi
            elif [ "${{ matrix.integration_mode }}" == "FetchContent" ]; then
              if [ -d "_deps" ]; then
                export PATH=$(find "$PWD/_deps" -name "*.dll" -exec dirname {} \; | sort -u | tr '\n' ':')$PATH
              fi
            fi
          fi
          ctest --output-on-failure
        else
          echo "Skipping tests for render module"
        fi

    - name: Build Template Project (Core)
      if: matrix.module == 'core'
      shell: bash
      run: |
        cmake -S examples/standalone/core-template-project -B b-c \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          $BASE_CMAKE_ARGS
        cmake --build b-c

    - name: Build Template Project (External)
      if: matrix.module == 'external'
      shell: bash
      run: |
        cmake -S examples/standalone/external-template-project -B b-e \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          $BASE_CMAKE_ARGS
        cmake --build b-e

    - name: Build Template Project (Render - Custom Shader)
      if: matrix.module == 'render'
      shell: bash
      run: |
        cmake -S examples/standalone/render-template-project-custom-shader -B b-rc \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          $BASE_CMAKE_ARGS
        cmake --build b-rc

    - name: Build Template Project (Render - Mesh Viewer)
      if: matrix.module == 'render'
      shell: bash
      run: |
        cmake -S examples/standalone/render-template-project-mesh-viewer -B b-rm \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          $BASE_CMAKE_ARGS
        cmake --build b-rm
